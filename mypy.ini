# Strict type checking for the integration (quality scale `strict-typing`, R42).
#
# The settings are Home Assistant 2026.11.1's own (`mypy.ini` in
# home-assistant/core, the [mypy] section that applies to integrations listed
# in `.strict-typing`), without its mypy plugins. tools/typing_stubs/ is a copy
# of its `stubs/voluptuous`: Home Assistant replaces voluptuous with probatio at
# run time (2026.9+), and the stub makes mypy see the same. Run against an
# environment with the matching Home Assistant installed, e.g. the one
# tests_ha/ uses:
#
#     pip install "pytest-homeassistant==2026.11.1" mypy
#     python -m mypy custom_components/lifesmart
[mypy]
python_version = 3.14
platform = linux
mypy_path = tools/typing_stubs
show_error_codes = true
follow_imports = normal
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[mypy-homeassistant.*]
no_implicit_reexport = true
