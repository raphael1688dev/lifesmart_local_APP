send_keys:
  description: Send IR key(s) to a remote.
  fields:
    remote_id:
      description: Remote ID returned by the hub.
      example: "AI_IR_xxxx_xxxxxxxx"
      selector:
        text:
    keys:
      description: One key or a list of keys to send.
      example: '["power","vol_up"]'
      selector:
        text:

set_hub_timezone:
  name: Set hub time zone
  description: Set the hub's time zone and daylight saving time (cfg:timezone).
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: lifesmart
    timezone:
      name: Time zone
      description: UTC offset in whole hours, -12 to 12. East is positive.
      required: true
      example: 8
      selector:
        number:
          min: -12
          max: 12
          step: 1
          mode: box
    daylight_saving:
      name: Daylight saving time
      default: false
      selector:
        boolean:

rename_device:
  name: Rename device on the hub
  description: Set the name the hub stores for itself or one of its devices (cfg:devname). The integration reloads afterwards.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: lifesmart
    device_id:
      name: Device
      description: Leave empty, or pick the hub, to rename the hub itself.
      selector:
        device:
          integration: lifesmart
    name:
      name: Name
      required: true
      selector:
        text:

upgrade_hub_firmware:
  name: Upgrade hub firmware
  description: Download the latest official firmware from LifeSmart's server to the hub (cfg:upgrade). It takes effect after the hub restarts.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: lifesmart
    reboot:
      name: Restart when downloaded
      default: false
      selector:
        boolean:

factory_reset_hub:
  name: Factory reset hub
  description: Restore the hub's factory settings and restart it (cfg:reset). This cannot be undone.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: lifesmart
    confirm:
      name: Confirm
      description: Must be on, or the action is refused.
      required: true
      selector:
        boolean:
