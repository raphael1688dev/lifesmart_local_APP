name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # HA Core requires Python >= 3.14.2 since 2026.5.0, and our hacs.json
        # minimum is 2026.11.0 (R23), so 3.14 is the only interpreter this
        # code ever runs on.
        # R18 (2026-10-09): matrix was 3.12/3.13 — neither is an HA-supported
        # version, so the gate never exercised the real runtime.
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        # The test suite uses HA stubs (tests/conftest.py) and only needs
        # pytest itself — no homeassistant install required.
        run: pip install --upgrade pip pytest

      - name: Run pytest
        # -W error: a warning (e.g. a coroutine that was never awaited) fails
        # the run, as it does locally (R30).
        run: pytest tests/ -v -W error

  pytest-ha:
    name: config flow under Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the Home Assistant test harness
        # R33: tests_ha/ drives the config flow through Home Assistant's own
        # flow manager (quality scale `config-flow-test-coverage`).
        # R39: `pytest-homeassistant` is Home Assistant's own test package,
        # versioned with Home Assistant; it replaces
        # pytest-homeassistant-custom-component (last release ran 2026.10.4,
        # marked broken by its author). Pinned, so a new Home Assistant
        # cannot change what this job tests without a commit.
        run: pip install --upgrade pip "pytest-homeassistant==2026.11.1" pytest-cov

      - name: Run the config flow tests, 100 % line coverage required
        run: >
          python -m pytest tests_ha -v -o asyncio_mode=auto -p no:respx
          --cov=custom_components/lifesmart --cov-config=tests_ha/coverage.ini
          --cov-report=term-missing --cov-fail-under=100

  compile:
    name: py_compile (full integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Syntax check every .py
        # Catches "manifest.json is fine but a sibling .py won't import"
        # regressions before they hit a user's Home Assistant log.
        run: python -m compileall -q custom_components/ tests/ tests_ha/

  json-valid:
    name: JSON manifest + translations valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate JSON files
        run: |
          set -e
          for f in custom_components/lifesmart/manifest.json \
                   custom_components/lifesmart/icons.json \
                   custom_components/lifesmart/translations/*.json \
                   hacs.json; do
            python -c "import json,sys; json.load(open('$f')); print('OK  $f')"
          done

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest (HA official manifest validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
