name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        # The test suite uses HA stubs (tests/conftest.py) and only needs
        # pytest itself — no homeassistant install required.
        run: pip install --upgrade pip pytest

      - name: Run pytest
        run: pytest tests/ -v

  compile:
    name: py_compile (full integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax check every .py
        # Catches "manifest.json is fine but a sibling .py won't import"
        # regressions before they hit a user's Home Assistant log.
        run: python -m compileall -q custom_components/lifesmart/ tests/

  json-valid:
    name: JSON manifest + translations valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON files
        run: |
          set -e
          for f in custom_components/lifesmart/manifest.json \
                   custom_components/lifesmart/translations/*.json \
                   hacs.json; do
            python -c "import json,sys; json.load(open('$f')); print('OK  $f')"
          done
