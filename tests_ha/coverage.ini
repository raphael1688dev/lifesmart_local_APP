# Coverage settings for tests_ha/ (R39, R40).
#
# Measured by path (`--cov=custom_components/lifesmart`), not by module name:
# with a module name, coverage imports the integration (and with it some 140
# Home Assistant modules) to locate it, before pytest-homeassistant has set
# Home Assistant up. Home Assistant's loader then sees two copies of its own
# classes and every flow fails ("'Integration' object has no attribute
# 'add_done_callback'").
#
# Two gates, checked with `coverage report` after the run (see the CI job):
#   config_flow.py          100 %   quality scale config-flow-test-coverage
#   the whole integration  > 95 %   quality scale test-coverage
[run]
source = custom_components/lifesmart

[report]
show_missing = True
